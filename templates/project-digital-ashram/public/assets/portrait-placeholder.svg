      <stop offset="0%" stop-color="#321D12"/>
      <stop offset="50%" stop-color="#190F0C"/>
      <stop offset="100%" stop-color="#0A0605"/>
    </radialGradient>
    <linearGradient id="terracottaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>

  <!-- Ornate Arch -->
  <path d="M50 710 V280 C50 140 160 40 300 40 C440 40 550 140 550 280 V710 Z" stroke="url(#terracottaGold)" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M68 695 V285 C68 155 170 60 300 60 C430 60 532 155 532 285 V695 Z" stroke="url(#terracottaGold)" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.4"/>

