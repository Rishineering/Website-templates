<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B1106"/>
      <stop offset="50%" stop-color="#6B1E0B"/>
      <stop offset="100%" stop-color="#280903"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#EA580C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg1)"/>
  <circle cx="400" cy="195" r="190" fill="url(#sunGlow)"/>
  <rect x="18" y="18" width="764" height="384" rx="18" stroke="url(#gold1)" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Sacred Janma Kundli & Surya Mandala -->
  <g transform="translate(400, 175)">
    <circle r="118" stroke="url(#gold1)" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle r="96" stroke="url(#gold1)" stroke-width="1.2" stroke-dasharray="4 6" stroke-opacity="0.65"/>
    <!-- North Indian Kundli Diamond Chart -->
    <rect x="-66" y="-66" width="132" height="132" stroke="url(#gold1)" stroke-width="1.8" fill="#2A0B04" fill-opacity="0.65"/>
    <line x1="-66" y1="-66" x2="66" y2="66" stroke="url(#gold1)" stroke-width="1.3" stroke-opacity="0.75"/>
    <line x1="66" y1="-66" x2="-66" y2="66" stroke="url(#gold1)" stroke-width="1.3" stroke-opacity="0.75"/>
    <polygon points="0,-66 66,0 0,66 -66,0" stroke="url(#gold1)" stroke-width="1.6" fill="none"/>
    <circle cx="0" cy="0" r="14" fill="url(#gold1)"/>
  </g>

  <!-- Luxury "YOUR PHOTO HERE" Pill -->
  <g transform="translate(400, 348)">
    <rect x="-155" y="-24" width="310" height="46" rx="23" fill="#1A0602" fill-opacity="0.9" stroke="url(#gold1)" stroke-width="1.4"/>
    <text x="0" y="-2" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFF7ED" text-anchor="middle" letter-spacing="1.8">
      YOUR OFFERING PHOTO HERE
    </text>
    <text x="0" y="14" font-family="Georgia, serif" font-size="10.5" fill="#FDBA74" text-anchor="middle">
      जन्म कुंडली एवं ज्योतिष चित्र
    </text>
  </g>
</svg>
