<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2A1B14"/>
      <stop offset="45%" stop-color="#140E18"/>
      <stop offset="100%" stop-color="#070609"/>
    </radialGradient>
    <radialGradient id="haloGlow" cx="50%" cy="36%" r="38%">
      <stop offset="0%" stop-color="#F3DFA5" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#D4AF37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8EBD0"/>
      <stop offset="30%" stop-color="#E6C665"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="goldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8EBD0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F3DFA5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGlow)"/>
  <circle cx="400" cy="360" r="320" fill="url(#haloGlow)"/>

  <!-- Outer Sacred Arch Frame -->
  <path d="M80 940 V380 C80 190 220 65 400 65 C580 65 720 190 720 380 V940 Z" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.6"/>
  <path d="M102 922 V384 C102 206 234 88 400 88 C566 88 698 206 698 384 V922 Z" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="6 6" stroke-opacity="0.4"/>

  <!-- Celestial Mandala Behind Head -->
  <g transform="translate(400, 350)" opacity="0.6">
    <circle r="210" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.35"/>
    <circle r="185" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 8" stroke-opacity="0.55"/>
    <circle r="152" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5"/>
    <polygon points="0,-145 126,72 -126,72" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.45" fill="none"/>
    <polygon points="0,145 126,-72 -126,-72" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.45" fill="none"/>
  </g>

  <!-- Pandit Silhouette -->
  <g opacity="0.85">
    <path d="M160 920 C172 730 255 620 400 620 C545 620 628 730 640 920 Z" fill="#15101C" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M285 640 C325 730 365 815 400 920" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.7"/>
    <path d="M515 640 C475 730 435 815 400 920" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.7"/>
    <!-- Head & Tilak -->
    <path d="M400 290 C340 290 306 342 306 412 C306 488 346 548 400 548 C454 548 494 488 494 412 C494 342 460 290 400 290 Z" fill="#1A1322" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="400" cy="380" r="5.5" fill="#D4AF37"/>
    <!-- Sacred Rudraksha Mala -->
    <path d="M336 620 Q400 730 464 620" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="5 7" fill="none"/>
  </g>

  <!-- CENTRAL LUXURY BADGE: "YOUR PHOTO HERE" -->
  <g transform="translate(400, 710)">
    <!-- Outer Glow Box -->
    <rect x="-240" y="-85" width="480" height="170" rx="24" fill="#0C0A10" fill-opacity="0.92" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="-232" y="-77" width="464" height="154" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5"/>

    <!-- Camera / Portrait Icon Frame -->
    <circle cx="0" cy="-38" r="28" fill="#1D1625" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <!-- Camera Icon SVG Path -->
    <g transform="translate(-14, -52)" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h3l2-3h10l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z"/>
      <circle cx="14" cy="15" r="4"/>
    </g>

    <!-- Main Placeholder Text -->
    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      YOUR PHOTO HERE
    </text>

    <!-- Subtitle Devanagari & English -->
    <text x="0" y="34" font-family="'Noto Serif Devanagari', 'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="600" fill="#E6C665" text-anchor="middle" letter-spacing="1">
      पंडित जी की फोटो यहाँ लगेगी
    </text>

    <text x="0" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#A39A8B" text-anchor="middle" letter-spacing="0.5">
      Drop your real photo or portrait here anytime
    </text>
  </g>

  <!-- Corner Filigree Ornaments -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6">
    <path d="M40 80 H95 M40 80 V135"/>
    <path d="M760 80 H705 M760 80 V135"/>
    <path d="M40 940 H95 M40 940 V885"/>
    <path d="M760 940 H705 M760 940 V885"/>
  </g>
</svg>
