    <path d="M300 210 C250 210 220 255 220 315 C220 375 255 425 300 425 C345 425 380 375 380 315 C380 255 350 210 300 210 Z" fill="#231712" stroke="url(#terracottaGold)" stroke-width="1.8"/>
    <circle cx="300" cy="285" r="4.5" fill="#F59E0B"/>
  </g>

  <!-- Central Badge: YOUR PHOTO HERE -->
  <g transform="translate(300, 520)">
    <rect x="-190" y="-70" width="380" height="140" rx="20" fill="#0E0806" fill-opacity="0.95" stroke="url(#terracottaGold)" stroke-width="2"/>
    <rect x="-182" y="-62" width="364" height="124" rx="14" fill="none" stroke="url(#terracottaGold)" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5"/>

    <!-- Camera Icon -->
    <circle cx="0" cy="-30" r="22" fill="#24140F" stroke="url(#terracottaGold)" stroke-width="1.5"/>
    <g transform="translate(-11, -41)" stroke="url(#terracottaGold)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h2.5l1.5-2.5h6l1.5 2.5H17a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H3a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 3 6z"/>
      <circle cx="10" cy="11.5" r="3"/>
    </g>

    <text x="0" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
