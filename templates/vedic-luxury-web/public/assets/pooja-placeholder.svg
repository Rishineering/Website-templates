<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <radialGradient id="poojaBg" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#2D171A"/>
      <stop offset="48%" stop-color="#140D17"/>
      <stop offset="100%" stop-color="#08060B"/>
    </radialGradient>
    <radialGradient id="flameAura" cx="50%" cy="32%" r="35%">
      <stop offset="0%" stop-color="#F6E6B4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kalashGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8EBD0"/>
      <stop offset="35%" stop-color="#E6C665"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A721C"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#poojaBg)"/>
  <circle cx="400" cy="220" r="230" fill="url(#flameAura)"/>

  <!-- Inner Ornate Borders -->
  <rect x="24" y="24" width="752" height="552" rx="20" stroke="url(#kalashGold)" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="36" y="36" width="728" height="528" rx="14" stroke="url(#kalashGold)" stroke-width="0.8" stroke-dasharray="6 8" stroke-opacity="0.35"/>

  <!-- Sacred Kalash & Mandala in background -->
  <g transform="translate(400, 220)" opacity="0.45">
    <circle r="160" stroke="url(#kalashGold)" stroke-width="1"/>
    <circle r="130" stroke="url(#kalashGold)" stroke-width="1.2" stroke-dasharray="4 8"/>
    <!-- Sacred Kalash Outline -->
    <path d="M-36 -32 H36 L24 -12 H-24 Z" fill="#241B15" stroke="url(#kalashGold)" stroke-width="2"/>
    <path d="M-24 -12 C-70 10 -85 60 -55 105 C-38 130 38 130 55 105 C85 60 70 10 24 -12 Z" fill="#241B15" stroke="url(#kalashGold)" stroke-width="2"/>
    <circle cx="0" cy="-60" r="28" fill="#1C1412" stroke="url(#kalashGold)" stroke-width="1.8"/>
    <!-- Sacred Jyoti Flame -->
    <path d="M0 -140 C14 -115 16 -95 0 -80 C-16 -95 -14 -115 0 -140 Z" fill="url(#kalashGold)"/>
  </g>

  <!-- PROMINENT LUXURY BADGE: "YOUR POOJA / RITUAL PHOTO HERE" -->
  <g transform="translate(400, 415)">
    <!-- Glassmorphic Card -->
    <rect x="-270" y="-80" width="540" height="160" rx="22" fill="#0C0A10" fill-opacity="0.94" stroke="url(#kalashGold)" stroke-width="2"/>
    <rect x="-262" y="-72" width="524" height="144" rx="16" fill="none" stroke="url(#kalashGold)" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5"/>

    <!-- Central Image / Video Icon -->
    <circle cx="0" cy="-35" r="26" fill="#201521" stroke="url(#kalashGold)" stroke-width="1.8"/>
    <g transform="translate(-13, -48)" stroke="url(#kalashGold)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="3"/>
      <circle cx="8" cy="9" r="1.5"/>
      <path d="M21 15l-5-5L5 20"/>
    </g>

    <!-- Main Text -->
    <text x="0" y="9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      YOUR PHOTO OR VIDEO HERE
    </text>

    <!-- Devanagari Subtitle -->
    <text x="0" y="34" font-family="'Noto Serif Devanagari', 'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="600" fill="#E6C665" text-anchor="middle" letter-spacing="1">
      पूजा या अनुष्ठान की फोटो / वीडियो यहाँ लगेगी
    </text>

    <!-- Context Meta -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#A39A8B" text-anchor="middle" letter-spacing="0.5">
      Drop your real ritual photo or video in public/assets/ anytime
    </text>
  </g>
</svg>
