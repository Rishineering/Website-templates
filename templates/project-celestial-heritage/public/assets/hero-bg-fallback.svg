<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <radialGradient id="celestialBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1D1522"/>
      <stop offset="45%" stop-color="#0D0A12"/>
      <stop offset="100%" stop-color="#070609"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#F3DFA5" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#D4AF37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E6B4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9A721C" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#celestialBg)"/>
  <circle cx="960" cy="540" r="640" fill="url(#sunCore)"/>

  <!-- Starfield -->
  <g fill="#F6E6B4" opacity="0.45">
    <circle cx="180" cy="160" r="1.5"/>
    <circle cx="340" cy="280" r="2"/>
    <circle cx="240" cy="760" r="1.5"/>
    <circle cx="520" cy="140" r="2.2"/>
    <circle cx="1440" cy="180" r="2"/>
    <circle cx="1680" cy="300" r="1.5"/>
    <circle cx="1590" cy="790" r="2.2"/>
    <circle cx="1360" cy="880" r="1.5"/>
    <circle cx="420" cy="900" r="1.8"/>
    <circle cx="140" cy="510" r="2"/>
    <circle cx="1790" cy="560" r="1.8"/>
  </g>

  <!-- Constellation Lines Left & Right -->
  <g stroke="url(#goldLine)" stroke-width="0.8" opacity="0.45">
    <polyline points="180,160 340,280 290,440 140,510"/>
    <polyline points="1440,180 1680,300 1620,480 1790,560"/>
  </g>

  <!-- Central Grand Vedic Astrolabe / Sri Yantra Wheel -->
  <g transform="translate(960, 540)" opacity="0.55">
    <circle r="460" stroke="url(#goldLine)" stroke-width="1"/>
    <circle r="430" stroke="url(#goldLine)" stroke-width="1.2" stroke-dasharray="4 10"/>
    <circle r="370" stroke="url(#goldLine)" stroke-width="1"/>
    <circle r="300" stroke="url(#goldLine)" stroke-width="1.5"/>
    <circle r="230" stroke="url(#goldLine)" stroke-width="1" stroke-dasharray="8 8"/>
    <circle r="160" stroke="url(#goldLine)" stroke-width="1.2"/>

    <!-- 12 Rashis / Houses Spokes -->
    <g stroke="url(#goldLine)" stroke-width="0.9">
      <line x1="0" y1="-460" x2="0" y2="460"/>
      <line x1="-460" y1="0" x2="460" y2="0"/>
      <line x1="-398" y1="-230" x2="398" y2="230"/>
      <line x1="-230" y1="-398" x2="230" y2="398"/>
      <line x1="230" y1="-398" x2="-230" y2="398"/>
      <line x1="398" y1="-230" x2="-398" y2="230"/>
    </g>

    <!-- Sacred Interlocking Geometry -->
    <polygon points="0,-295 255,147 -255,147" stroke="url(#goldLine)" stroke-width="1.3" fill="none"/>
    <polygon points="0,295 255,-147 -255,-147" stroke="url(#goldLine)" stroke-width="1.3" fill="none"/>
    <rect x="-212" y="-212" width="424" height="424" stroke="url(#goldLine)" stroke-width="1" fill="none" transform="rotate(45)"/>
    <rect x="-212" y="-212" width="424" height="424" stroke="url(#goldLine)" stroke-width="1" fill="none"/>
  </g>
</svg>
