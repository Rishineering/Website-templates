<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <radialGradient id="poojaBg" cx="50%" cy="48%" r="68%">
      <stop offset="0%" stop-color="#2B1618"/>
      <stop offset="48%" stop-color="#130D16"/>
      <stop offset="100%" stop-color="#08060B"/>
    </radialGradient>
    <radialGradient id="flameAura" cx="50%" cy="38%" r="32%">
      <stop offset="0%" stop-color="#F6E6B4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kalashGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E6B4"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#9A721C"/>
      <stop offset="100%" stop-color="#F3DFA5"/>
    </linearGradient>
    <linearGradient id="kalashBody" x1="25%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3A2814"/>
      <stop offset="50%" stop-color="#1F1610"/>
      <stop offset="100%" stop-color="#100B0B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#poojaBg)"/>
  <circle cx="400" cy="240" r="240" fill="url(#flameAura)"/>

  <!-- Inner Ornate Border -->
  <rect x="28" y="28" width="744" height="544" rx="18" stroke="url(#kalashGold)" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="42" y="42" width="716" height="516" rx="12" stroke="url(#kalashGold)" stroke-width="0.8" stroke-dasharray="5 7" stroke-opacity="0.3"/>

  <!-- Sacred Mandala Backdrop -->
  <g transform="translate(400, 290)" opacity="0.55">
    <circle r="195" stroke="url(#kalashGold)" stroke-width="1" stroke-opacity="0.35"/>
    <circle r="165" stroke="url(#kalashGold)" stroke-width="1.2" stroke-dasharray="4 8" stroke-opacity="0.5"/>
    <circle r="130" stroke="url(#kalashGold)" stroke-width="1" stroke-opacity="0.4"/>
    <polygon points="0,-150 130,75 -130,75" stroke="url(#kalashGold)" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>
    <polygon points="0,150 130,-75 -130,-75" stroke="url(#kalashGold)" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>
  </g>

  <!-- Sacred Purna Kalash & Coconut with Mango Leaves -->
  <g transform="translate(400, 320)">
    <!-- Sacred Flame / Jyoti at top -->
    <path d="M0 -185 C16 -160 20 -138 0 -120 C-20 -138 -16 -160 0 -185 Z" fill="url(#kalashGold)" opacity="0.95"/>
    <path d="M0 -170 C8 -155 10 -142 0 -130 C-10 -142 -8 -155 0 -170 Z" fill="#FFF7DF"/>

    <!-- Shriphal (Sacred Coconut) -->
    <ellipse cx="0" cy="-86" rx="36" ry="44" fill="url(#kalashBody)" stroke="url(#kalashGold)" stroke-width="2"/>

    <!-- Mango Leaves (Pallava) -->
    <path d="M-24 -68 C-65 -95 -98 -68 -86 -26 C-62 -36 -38 -48 -24 -68 Z" fill="#1E1814" stroke="url(#kalashGold)" stroke-width="1.8"/>
    <path d="M24 -68 C65 -95 98 -68 86 -26 C62 -36 38 -48 24 -68 Z" fill="#1E1814" stroke="url(#kalashGold)" stroke-width="1.8"/>
    <path d="M-12 -64 C-40 -86 -62 -56 -52 -20 C-34 -32 -22 -48 -12 -64 Z" fill="#2A2018" stroke="url(#kalashGold)" stroke-width="1.5"/>
    <path d="M12 -64 C40 -86 62 -56 52 -20 C34 -32 22 -48 12 -64 Z" fill="#2A2018" stroke="url(#kalashGold)" stroke-width="1.5"/>

    <!-- Kalash Neck & Rim -->
    <path d="M-46 -56 H46 L34 -32 H-34 Z" fill="url(#kalashBody)" stroke="url(#kalashGold)" stroke-width="2"/>
    <!-- Kalash Vessel -->
    <path d="M-34 -32 C-86 -10 -105 55 -70 112 C-48 145 48 145 70 112 C105 55 86 -10 34 -32 Z" fill="url(#kalashBody)" stroke="url(#kalashGold)" stroke-width="2.2"/>

    <!-- Ornate Gold Bands & Swastika/Lotus Motif on Kalash -->
    <path d="M-76 28 Q0 46 76 28" stroke="url(#kalashGold)" stroke-width="1.8" fill="none"/>
    <path d="M-80 42 Q0 60 80 42" stroke="url(#kalashGold)" stroke-width="1.2" stroke-dasharray="4 6" fill="none"/>
    <!-- Sacred Swastika /吉祥 Emblem -->
    <g transform="translate(0, 8)" stroke="url(#kalashGold)" stroke-width="2.4" stroke-linecap="round">
      <line x1="-16" y1="0" x2="16" y2="0"/>
      <line x1="0" y1="-16" x2="0" y2="16"/>
      <line x1="0" y1="-16" x2="14" y2="-16"/>
      <line x1="16" y1="0" x2="16" y2="14"/>
      <line x1="0" y1="16" x2="-14" y2="16"/>
      <line x1="-16" y1="0" x2="-16" y2="-14"/>
    </g>

    <!-- Kalash Pedestal / Lotus Base -->
    <path d="M-52 135 H52 L68 158 H-68 Z" fill="url(#kalashBody)" stroke="url(#kalashGold)" stroke-width="2"/>
    <line x1="-110" y1="158" x2="110" y2="158" stroke="url(#kalashGold)" stroke-width="2"/>
  </g>
</svg>
