  <rect width="800" height="420" fill="url(#bg3)"/>
  <rect x="18" y="18" width="764" height="384" rx="18" stroke="url(#gold3)" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Sacred Havan Kund & Agni Flame -->
